<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Para Lorrany</title>
<style>
:root{
  --bg:#05060d; --ink:#f3efe8; --soft:rgba(243,239,232,.66); --gold:#d9bf8c;
  --glass:rgba(14,16,28,.52); --edge:rgba(255,255,255,.1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05060d}}
:root[data-theme="dark"]{--bg:#05060d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.nebula{position:fixed;inset:0;background:
  radial-gradient(60% 40% at 20% 15%,rgba(80,60,140,.28),transparent 70%),
  radial-gradient(50% 40% at 85% 85%,rgba(150,100,60,.2),transparent 70%),
  radial-gradient(80% 60% at 50% 50%,#0a0c1a,#05060d 80%)}
canvas{position:fixed;inset:0;width:100%;height:100%}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 22px calc(env(safe-area-inset-bottom,0px) + 28px)}
.card{width:100%;max-width:440px;max-height:100%;overflow-y:auto;padding:38px 30px 30px;border-radius:30px;
  background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
  transition:opacity .9s ease,transform .9s ease,filter .9s ease}
.card.out{opacity:0;transform:translateY(-10px) scale(.985);filter:blur(8px)}
.card.pre{opacity:0;transform:translateY(14px) scale(.99);filter:blur(8px);transition:none}
.k{font-size:13px;letter-spacing:.04em;color:var(--gold);margin-bottom:22px}
h1,h2{font-weight:600;letter-spacing:-.03em;line-height:1.08}
h1{font-size:clamp(54px,17vw,76px)}
h2{font-size:clamp(28px,8.4vw,36px);margin-bottom:22px}
p{font-size:18px;line-height:1.55;color:var(--soft);font-weight:400;letter-spacing:-.005em}
p+p{margin-top:16px}
p b{color:var(--ink);font-weight:500}
.l{opacity:0;transform:translateY(8px);animation:in 1.1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*.55s + .35s)}
@keyframes in{to{opacity:1;transform:none}}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:30px;opacity:0;animation:in 1s forwards;animation-delay:var(--fd,2s)}
.dots{display:flex;gap:6px}
.dots i{width:5px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);transition:all .5s}
.dots i.on{width:20px;background:var(--gold)}
button{font:inherit;font-size:16px;font-weight:500;color:var(--ink);background:rgba(255,255,255,.08);
  border:1px solid var(--edge);padding:13px 22px;border-radius:999px;cursor:pointer;min-height:44px}
button:active{transform:scale(.97);background:rgba(255,255,255,.14)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.big{font-size:clamp(34px,10vw,44px)}
@media (prefers-reduced-motion:reduce){.l,.foot{animation-duration:.01s;animation-delay:0s}.card{transition:none}}
</style>
</head>
<body>
<div class="nebula"></div>
<canvas id="sky" aria-hidden="true"></canvas>
<main id="stage"><section class="card" id="card" aria-live="polite"></section></main>

<script>
const scenes=[
 {cover:true,k:"Para Lorrany",t:"25 dias.",l:["Leia com calma. Foi escrito para você, e só para você."],b:"Começar"},
 {k:"O tempo",t:"Vinte e cinco dias.",l:["É pouco tempo para quase tudo.","Menos para o que você fez comigo.","Minha rotina virou do avesso. Meus pensamentos mudaram de endereço, e todos moram em você agora."]},
 {k:"Antes de tudo",t:"Eu errei.",l:["Você tinha algo importante para me dizer. Merecia dizer olhando nos meus olhos, com a minha atenção inteira e sem tela no meio.","Eu deixei que virasse mensagem. Foi impulso, foi pressa. Isso explica, mas não justifica."]},
 {k:"Sem defesa",t:"Eu não vou me defender.",l:["Uma conversa assim não cabe num texto. Cabe numa voz, num silêncio dividido, num olhar que não desvia.","Eu tirei isso de você, e sinto o peso disso."]},
 {k:"Perdão",t:"Me perdoa.",l:["Não peço para me sentir leve. Peço para ter a chance de ser melhor.","<b>O que for seu vai ter o meu rosto, a minha voz e o meu tempo. Primeiro, sempre.</b>"]},
 {k:"A verdade",t:"Eu não sou assim.",l:["Em 25 dias você virou a primeira coisa em que penso ao acordar e a última que procuro antes de dormir.","Não é pressa. Algumas pessoas chegam e reorganizam tudo, e a gente só percebe quando já virou outro alguém."]},
 {k:"Respeito",t:"Você é uma rainha.",l:["Eu não conquisto você. Eu respeito você. Escuto antes de falar, não apresso, não cobro.","O seu tempo é seu. O meu lugar é ao lado dele, esperando com paciência e com tudo o que eu sou."]},
 {final:true,k:"O que eu sinto",t:"Eu estou apaixonado por você.",l:["É a coisa mais verdadeira que eu sei hoje.","Não peço promessa nenhuma. Peço uma conversa, pessoalmente, como você sempre mereceu. Eu escuto tudo, até o que for difícil."],b:"Reler do começo"}
];
const card=document.getElementById('card');let cur=0,busy=false;
function render(i){
  const s=scenes[i];let n=0;
  const lines=s.l.map(x=>`<p class="l" style="--i:${++n}">${x}</p>`).join('');
  const dots=scenes.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('');
  const fd=(n*.55+.9).toFixed(2)+'s';
  card.innerHTML=`<div class="k l" style="--i:0">${s.k}</div>
   ${s.cover?`<h1 class="l" style="--i:0">${s.t}</h1><div style="height:20px"></div>`:`<h2 class="l ${s.final?'big':''}" style="--i:0">${s.t}</h2>`}
   ${lines}
   <div class="foot" style="--fd:${fd}"><div class="dots">${dots}</div><button id="go">${s.b||'Continuar'}</button></div>`;
  card.scrollTop=0;
  document.getElementById('go').onclick=next;
  if(s.final)setTimeout(()=>burst(),1200);
}
function show(i){
  busy=true;card.classList.add('out');
  setTimeout(()=>{cur=i;render(i);card.classList.add('pre');card.classList.remove('out');
    void card.offsetWidth;card.classList.remove('pre');busy=false;},900);
}
function next(){if(busy)return;show(cur===scenes.length-1?0:cur+1);}
render(0);

/* céu estrelado */
const cv=document.getElementById('sky'),cx=cv.getContext('2d');
let W,H,D,stars=[],shots=[],mx=0,my=0;
function size(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);
  const c=Math.round(W*H/2600);stars=[];
  for(let i=0;i<c;i++){const z=Math.random();
    stars.push({x:Math.random()*W,y:Math.random()*H,z,r:.3+z*1.2,a:Math.random()*6.28,s:.4+Math.random()*1.4,
      h:Math.random()<.18?'255,226,180':'210,222,255'});}}
size();addEventListener('resize',size);
addEventListener('deviceorientation',e=>{mx=(e.gamma||0)/45;my=(e.beta||0)/90-.5;});
addEventListener('pointermove',e=>{mx=(e.clientX/W-.5)*2;my=(e.clientY/H-.5)*2;});
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
let t=0;
function frame(){
  t+=.016;cx.clearRect(0,0,W,H);
  for(const s of stars){
    if(!still){s.y-=.06*s.z;if(s.y<-2){s.y=H+2;s.x=Math.random()*W;}}
    const tw=.55+.45*Math.sin(t*s.s+s.a);
    const px=s.x+mx*10*s.z,py=s.y+my*10*s.z;
    cx.beginPath();cx.fillStyle=`rgba(${s.h},${(.25+.75*s.z)*tw})`;
    cx.arc(px,py,s.r,0,6.28);cx.fill();
  }
  if(!still&&Math.random()<.004)shots.push({x:Math.random()*W*.9,y:Math.random()*H*.4,vx:6+Math.random()*4,vy:2.5+Math.random()*2,l:1});
  for(let i=shots.length-1;i>=0;i--){const q=shots[i];
    const g=cx.createLinearGradient(q.x,q.y,q.x-q.vx*9,q.y-q.vy*9);
    g.addColorStop(0,`rgba(255,240,215,${q.l})`);g.addColorStop(1,'rgba(255,240,215,0)');
    cx.strokeStyle=g;cx.lineWidth=1.4;cx.beginPath();cx.moveTo(q.x,q.y);cx.lineTo(q.x-q.vx*9,q.y-q.vy*9);cx.stroke();
    q.x+=q.vx;q.y+=q.vy;q.l-=.014;if(q.l<=0)shots.splice(i,1);}
  requestAnimationFrame(frame);
}
frame();
function burst(){if(still)return;for(let i=0;i<6;i++)setTimeout(()=>shots.push({x:W*(.1+Math.random()*.6),y:H*Math.random()*.35,vx:7+Math.random()*4,vy:3+Math.random()*2,l:1}),i*260);}
</script>
</body>
</html>
